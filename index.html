<!doctype html>
<html lang="en" class="dark">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <style>
      /* Prevent iOS zoom on input focus (requires 16px+ font-size) */
      @media (max-width: 768px) {
        input, textarea, select { font-size: 16px !important; }
      }
      html, body { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    </style>
    <title>LevelStudio — Free Website Preview Tool</title>
    <meta name="description" content="LevelStudio instantly previews what your business website could look like. Answer a few questions and see a draft in minutes. Built by LevelUp Ecosystem." />
    <link rel="canonical" href="https://studio.levelup-ecosystem.com" />
    <meta name="robots" content="index, follow" id="meta-robots" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LevelStudio" />
    <meta property="og:url" content="https://studio.levelup-ecosystem.com" />
    <meta property="og:title" content="LevelStudio — Free Website Preview Tool" />
    <meta property="og:description" content="LevelStudio instantly previews what your business website could look like. Answer a few questions and see a draft in minutes. Built by LevelUp Ecosystem." />
    <meta property="og:image" content="https://studio.levelup-ecosystem.com/og-image.png" />
    <meta property="og:image:alt" content="LevelStudio — Free Website Preview Tool interface" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://studio.levelup-ecosystem.com" />
    <meta name="twitter:title" content="LevelStudio — Free Website Preview Tool" />
    <meta name="twitter:description" content="LevelStudio instantly previews what your business website could look like. Answer a few questions and see a draft in minutes. Built by LevelUp Ecosystem." />
    <meta name="twitter:image" content="https://studio.levelup-ecosystem.com/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LevelStudio",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "url": "https://studio.levelup-ecosystem.com",
      "isPartOf": {
        "@type": "Organization",
        "name": "LevelUp Ecosystem",
        "url": "https://levelup-ecosystem.com"
      },
      "creator": {
        "@type": "Organization",
        "name": "LevelUp Ecosystem",
        "url": "https://levelup-ecosystem.com"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "A free tool that generates an instant preview of a business website from a short guided questionnaire."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
